name: Timo Release

on:
  push:
    tags: ['v*-timo']

permissions:
  contents: read

concurrency:
  group: timo-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    if: github.repository == 'Timo-In/serie'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout tag and branch history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate fork tag and stable branch
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 .github/scripts/timo_release.py validate-tag "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          git merge-base --is-ancestor HEAD origin/timo/main

  checks:
    needs: validate
    uses: ./.github/workflows/timo-ci.yml

  build:
    needs: [validate, checks]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build and archive
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          cargo build --locked --release --target "$RELEASE_TARGET"
          test "$("target/$RELEASE_TARGET/release/serie" --version)" = "serie $RELEASE_VERSION"
          python3 .github/scripts/timo_release.py archive --target "$RELEASE_TARGET" --output releases
      - name: Upload archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: timo-release-${{ matrix.target }}
          path: releases/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [validate, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Download archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: timo-release-*
          path: releases
          merge-multiple: true
      - name: Generate checksums and Homebrew formula
        run: python3 .github/scripts/timo_release.py formula --artifacts releases --output releases/serie-timo.rb
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" releases/* --clobber
          else
            gh release create "$RELEASE_TAG" releases/* --verify-tag --generate-notes --latest --title "Serie $RELEASE_TAG (Timo fork)"
          fi
      - name: Upload Homebrew formula
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: timo-homebrew
          path: releases/serie-timo.rb
          if-no-files-found: error

  homebrew:
    needs: [validate, publish]
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Timo-In/homebrew-tap
          ref: main
          token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          path: tap
      - name: Download formula
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: timo-homebrew
          path: formula
      - name: Validate and commit formula
        working-directory: tap
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          mkdir -p Formula
          cp ../formula/serie-timo.rb Formula/serie-timo.rb
          ruby -c Formula/serie-timo.rb
          brew style Formula/serie-timo.rb
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/serie-timo.rb
          if ! git diff --cached --quiet; then
            git commit -m "chore(serie-timo): update to $RELEASE_VERSION"
          fi
      - name: Test installation from the generated formula
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          brew tap --custom-remote timo-ci/serie "$PWD/tap"
          brew install timo-ci/serie/serie-timo
          brew test timo-ci/serie/serie-timo
      - name: Publish formula to tap
        working-directory: tap
        run: git push origin HEAD:main
